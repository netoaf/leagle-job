name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows product and package gates
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out complete sanitized history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Go from the dashboard module
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: dashboard/go.mod
          cache: false

      - name: Validate the credential-free beginner setup
        shell: pwsh
        run: ./setup.ps1 -SkipBrowser

      - name: Run deterministic unit tests
        shell: pwsh
        run: npm.cmd run test:unit

      - name: Run the complete product suite
        shell: pwsh
        run: npm.cmd test

      - name: Run the integrated health gate
        shell: pwsh
        run: npm.cmd run jobfinder:health

      - name: Test the dashboard module
        working-directory: dashboard
        shell: pwsh
        run: go test ./...

      - name: Build a sanitized package smoke artifact
        shell: pwsh
        run: |
          ./scripts/create-package.ps1 -Version ci
          if (-not (Test-Path -LiteralPath "./dist/LeagleJob-vci.zip")) {
            throw "The sanitized package was not created."
          }

  secrets:
    name: Complete-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete sanitized history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan the complete Git history
        shell: bash
        run: "${RUNNER_TEMP}/gitleaks git --redact --no-banner --exit-code 1 ."
