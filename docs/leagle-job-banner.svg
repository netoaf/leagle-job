<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Leagle Job</title>
  <desc id="desc">Local-first job search pipeline with human review</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10233a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27c2ff"/>
      <stop offset="1" stop-color="#59e1b5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8db7d8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#background)"/>
  <rect width="1200" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="120" r="210" fill="#27c2ff" opacity=".07"/>
  <circle cx="1110" cy="530" r="270" fill="#59e1b5" opacity=".05"/>

  <g transform="translate(870 105)">
    <circle cx="135" cy="135" r="116" fill="#0b1728" stroke="url(#accent)" stroke-width="3"/>
    <path d="M49 151C83 136 105 112 124 72c10 35 9 64-4 90-18 35-48 56-89 62 22-20 32-43 18-73Z" fill="#27c2ff" opacity=".95"/>
    <path d="M221 151c-34-15-56-39-75-79-10 35-9 64 4 90 18 35 48 56 89 62-22-20-32-43-18-73Z" fill="#59e1b5" opacity=".95"/>
    <path d="M113 136l22-36 22 36-22 22Z" fill="#f4b860"/>
    <path d="M99 164c20 13 52 13 72 0-5 31-18 53-36 67-18-14-31-36-36-67Z" fill="#edf7ff"/>
    <circle cx="113" cy="137" r="4" fill="#07111f"/>
    <circle cx="157" cy="137" r="4" fill="#07111f"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="180" fill="#edf7ff" font-size="78" font-weight="800" letter-spacing="-2">LEAGLE JOB</text>
    <rect x="74" y="211" width="520" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)"/>
    <text x="72" y="286" fill="#b9d3e7" font-size="34" font-weight="500">Local-first job search pipeline</text>
    <text x="72" y="346" fill="#edf7ff" font-size="23" font-weight="600" letter-spacing="2">VERIFY  •  RANK  •  PREPARE  •  REVIEW</text>

    <g transform="translate(72 407)">
      <rect width="650" height="82" rx="16" fill="#0b1728" stroke="#8db7d8" stroke-opacity=".24"/>
      <circle cx="42" cy="41" r="13" fill="#59e1b5"/>
      <path d="m36 41 4 4 9-10" fill="none" stroke="#07111f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="36" fill="#edf7ff" font-size="20" font-weight="700">Human-in-the-loop by design</text>
      <text x="72" y="61" fill="#91adc3" font-size="16">No automatic applications, CV uploads or email sending</text>
    </g>

    <text x="72" y="548" fill="#6f91aa" font-size="17">Adapted from Career-Ops • MIT License</text>
  </g>
</svg>
